name: Fix checkout typo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix checkout invoice label text'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix label text
        run: |
          sed -i 's/Nombre orm empresa para la factura/Nombre o empresa para la factura/g' app/checkout/page.tsx
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/checkout/page.tsx
          git commit -m 'Fix checkout invoice label text'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-checkout-typo.yml
          git commit -m 'Remove temporary checkout typo workflow'
          git push
