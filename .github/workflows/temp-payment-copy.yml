name: Aplicar ajuste de pagos checkout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modificar checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/checkout/page.tsx')
          s=p.read_text()
          marker='const pasteMaps=()=>{const v=window.prompt("Pegá aquí el enlace de Google Maps de la ubicación de entrega:",form.maps_url||"");if(v!==null){set("maps_url",v.trim());setLocationStatus(v.trim()?"✓ Enlace de Google Maps guardado.":"")}};'
          addition=marker+'\n const copyText=async(value:string)=>{if(!value)return;try{await navigator.clipboard.writeText(value);setMsg("✓ Dato copiado");window.setTimeout(()=>setMsg(""),1600)}catch{setMsg("No se pudo copiar automáticamente. Seleccioná y copiá el dato manualmente.")}};'
          if 'const copyText=async(value:string)' not in s:
              if marker not in s: raise SystemExit('No se encontró pasteMaps')
              s=s.replace(marker,addition,1)
          oldpay='<label>Método de pago{form.delivery_type==="delivery"?<input value="Pago al recibir" disabled />:<input value="Transferencia" disabled />}<small className="field-optional">{form.delivery_type==="delivery"?"En Asunción y Central el pago es al recibir.":"Para envíos al interior el pago es por transferencia anticipada."}</small></label>'
          newpay='<label>Método de pago<select value={form.payment_method} onChange={e=>set("payment_method",e.target.value)} disabled={form.delivery_type==="delivery"}><option value="Pago al recibir">Pago al recibir</option><option value="Transferencia">Transferencia bancaria</option><option value="Giro Tigo">Giro Tigo</option></select><small className="field-optional">{form.delivery_type==="delivery"?"En Asunción y Central el pago es al recibir.":"Elegí Transferencia bancaria o Giro Tigo para pagar tu envío al interior."}</small></label>'
          if oldpay not in s: raise SystemExit('No se encontró el bloque de método de pago')
          s=s.replace(oldpay,newpay,1)
          oldbank='<div className="payment-instructions"><h3>Datos para transferencia</h3>{banks.length?banks.map(b=><div className="payment-box" key={b.id}><b>{b.bank}</b><br/>{b.account_type||"Cuenta"}<br/>N.º {b.account_number}<br/>Titular: {b.holder_name}{b.document&&<><br/>CI/RUC: {b.document}</>}{b.alias&&<><br/>Alias: {b.alias}</>}</div>):<p className="muted">Los datos de transferencia todavía no están configurados.</p>}<label>Referencia de operación<input value={paymentReference} onChange={e=>setPaymentReference(e.target.value)} placeholder="Opcional" /></label></div>}'
          newbank='<div className="payment-instructions"><h3>Datos para transferencia</h3>{banks.length?banks.map(b=><div className="payment-box" key={b.id}><div className="payment-copy-row"><b>{b.bank}</b><button type="button" className="payment-copy" onClick={()=>copyText(b.bank)}>Copiar</button></div><div className="payment-copy-row"><span>{b.account_type||"Cuenta"}</span></div><div className="payment-copy-row"><span>N.º {b.account_number||""}</span>{b.account_number&&<button type="button" className="payment-copy" onClick={()=>copyText(b.account_number||"")}>Copiar</button>}</div><div className="payment-copy-row"><span>Titular: {b.holder_name||""}</span>{b.holder_name&&<button type="button" className="payment-copy" onClick={()=>copyText(b.holder_name||"")}>Copiar</button>}</div>{b.document&&<div className="payment-copy-row"><span>CI/RUC: {b.document}</span><button type="button" className="payment-copy" onClick={()=>copyText(b.document||"")}>Copiar</button></div>}{b.alias&&<div className="payment-copy-row"><span>Alias: {b.alias}</span><button type="button" className="payment-copy" onClick={()=>copyText(b.alias||"")}>Copiar</button></div>}</div>):<p className="muted">Los datos de transferencia todavía no están configurados.</p>}<label>Referencia de operación<input value={paymentReference} onChange={e=>setPaymentReference(e.target.value)} placeholder="Opcional" /></label></div>}'
          if oldbank not in s: raise SystemExit('No se encontró el bloque bancario')
          s=s.replace(oldbank,newbank,1)
          oldtigo='<div className="payment-instructions"><h3>Datos para Giro Tigo</h3>{tigos.length?tigos.map(t=><div className="payment-box" key={t.id}><b>{t.phone}</b><br/>Titular: {t.holder_name}{t.document&&<><br/>CI/RUC: {t.document}</>}</div>):<p className="muted">Los datos de Giro Tigo todavía no están configurados.</p>}<label>Referencia de operación<input value={paymentReference} onChange={e=>setPaymentReference(e.target.value)} placeholder="Opcional" /></label></div>}'
          newtigo='<div className="payment-instructions"><h3>Datos para Giro Tigo</h3>{tigos.length?tigos.map(t=><div className="payment-box" key={t.id}><div className="payment-copy-row"><b>{t.phone}</b><button type="button" className="payment-copy" onClick={()=>copyText(t.phone)}>Copiar</button></div><div className="payment-copy-row"><span>Titular: {t.holder_name||""}</span>{t.holder_name&&<button type="button" className="payment-copy" onClick={()=>copyText(t.holder_name||"")}>Copiar</button>}</div>{t.document&&<div className="payment-copy-row"><span>CI/RUC: {t.document}</span><button type="button" className="payment-copy" onClick={()=>copyText(t.document||"")}>Copiar</button></div>}</div>):<p className="muted">Los datos de Giro Tigo todavía no están configurados.</p>}<label>Referencia de operación<input value={paymentReference} onChange={e=>setPaymentReference(e.target.value)} placeholder="Opcional" /></label></div>}'
          if oldtigo not in s: raise SystemExit('No se encontró el bloque Tigo')
          s=s.replace(oldtigo,newtigo,1)
          p.write_text(s)
          css=Path('app/checkout-polish.css')
          c=css.read_text()
          rules='''\n/* Botones para copiar datos de pago */\n.payment-copy-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0;min-height:30px}.payment-copy-row>span,.payment-copy-row>b{min-width:0;overflow-wrap:anywhere}.payment-copy{border:1px solid rgba(123,29,51,.18);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.payment-copy:hover{background:#faf5f6}.payment-copy:focus-visible{outline:2px solid #7b1d33;outline-offset:2px}\n'''
          if '/* Botones para copiar datos de pago */' not in c: css.write_text(c+rules)
          PY
      - name: Verificar cambios
        run: |
          grep -q 'Transferencia bancaria' app/checkout/page.tsx
          grep -q 'Giro Tigo' app/checkout/page.tsx
          grep -q 'payment-copy' app/checkout/page.tsx
          npx tsc --noEmit --pretty false
      - name: Commit y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/checkout/page.tsx app/checkout-polish.css
          git commit -m 'feat: habilitar giro tigo y copiar datos de pago'
          git push
