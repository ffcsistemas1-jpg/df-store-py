name: Improve Meta campaign table

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply table improvement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('app/admin/meta-ads/meta-ads-dashboard.tsx')
          text = dashboard.read_text(encoding='utf-8')

          pattern = r'<div className="meta-table-wrap"><table className="meta-table">.*?</table></div>'
          replacement = '''<div className="meta-table-wrap"><div className="meta-table-scroll"><table className="meta-table"><thead><tr><th>Campaña</th><th>Gasto</th><th>Impresiones</th><th>Alcance</th><th>Clics</th><th>CTR</th><th>CPC</th><th>Compras</th><th>ROAS</th></tr></thead><tbody>{(insights?.campaigns||[]).map(c=><tr key={c.id}><td data-label="Campaña"><span className="meta-campaign-name" title={c.name}>{c.name}</span></td><td data-label="Gasto"><strong>{money(c.spend)}</strong></td><td data-label="Impresiones">{integer(c.impressions)}</td><td data-label="Alcance">{integer(c.reach)}</td><td data-label="Clics">{integer(c.clicks)}</td><td data-label="CTR">{c.ctr.toFixed(2)}%</td><td data-label="CPC">{money(c.cpc)}</td><td data-label="Compras">{integer(c.purchases)}</td><td data-label="ROAS">{c.roas.toFixed(2)}×</td></tr>)}</tbody></table></div></div>'''

          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('No se encontró la tabla de campañas para modificar')
          dashboard.write_text(updated, encoding='utf-8')

          css = Path('app/globals.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* Meta campaign table polish */'
          if marker not in css_text:
              css_text += '''\n\n/* Meta campaign table polish */\n.meta-campaigns{overflow:hidden}.meta-table-wrap{width:100%;overflow-x:auto}.meta-table-scroll{min-width:980px}.meta-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}.meta-table th{background:#faf7f5;color:#5c5557;font-size:11px;text-transform:uppercase;letter-spacing:.35px;font-weight:900;text-align:right;padding:13px 12px;border-bottom:1px solid #eadfe0;white-space:nowrap}.meta-table th:first-child{text-align:left}.meta-table td{padding:15px 12px;text-align:right;border-bottom:1px solid #f0e7e7;vertical-align:middle;white-space:nowrap}.meta-table td:first-child{text-align:left;white-space:normal;max-width:270px}.meta-table tbody tr:last-child td{border-bottom:0}.meta-table tbody tr:hover{background:#fffafc}.meta-campaign-name{display:block;max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;color:#21171a}.meta-table td strong{font-weight:900;color:#21171a}\n'''
              css.write_text(css_text, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/meta-ads/meta-ads-dashboard.tsx app/globals.css .github/workflows/improve-meta-campaign-table.yml
          git rm -f .github/workflows/improve-meta-campaign-table.yml
          git commit -m "fix: improve Meta campaign table readability"
          git push