name: Fix checkout invoice fields
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Restore checkout and apply invoice fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known good checkout version
        run: |
          git show 4b9e8dfa3eaf7a11d504f5088f62c40f0e06b005:app/checkout/page.tsx > app/checkout/page.tsx
      - name: Commit repaired checkout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/checkout/page.tsx
          git commit -m 'Restore checkout and apply invoice fields'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-checkout-invoice.yml
          git commit -m 'Remove temporary checkout repair workflow'
          git push
